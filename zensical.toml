# Zensical config for the Aurora Silicon documentation site.
# Copyright (c) 2026 Aurora Silicon

[project]
site_name = "Aurora Silicon"
site_url = "https://aurora-silicon.github.io/"
site_description = "Windows and DirectX 12 on Apple Silicon"
repo_url = "https://github.com/aurora-silicon"
repo_name = "aurora-silicon"
copyright = "&copy; 2026 Aurora Silicon contributors"
docs_dir = "docs"
site_dir = "site"
extra_css = ["stylesheets/aurora.css"]

nav = [
  { "Home" = "index.md" },
  { "Projects" = [
    "projects/index.md",
    { "d3d12agx — DirectX 12 on AGX" = [
      "projects/d3d12agx/index.md",
      "projects/d3d12agx/conformance.md",
      "projects/d3d12agx/architecture.md",
      "projects/d3d12agx/limits.md",
    ] },
    { "Windows on Apple Silicon" = "projects/windows.md" },
  ] },
  { "Hardware Support" = "platform/support.md" },
  { "For Developers" = [
    "developers/building.md",
    "developers/testing.md",
    "developers/contributing.md",
  ] },
  { "Project" = [
    "project/faq.md",
    "project/glossary.md",
    "project/method.md",
  ] },
]

[project.theme]
variant = "modern"
language = "en"
font.text = "Inter"
font.code = "JetBrains Mono"
features = [
  "content.code.copy",
  "content.code.annotate",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/aurora-silicon"

[[project.extra.social]]
icon = "fontawesome/brands/discord"
link = "https://discord.gg/DXmsSSc5aY"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc = { permalink = true }
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji = {
  emoji_generator = "zensical.extensions.emoji.to_svg",
  emoji_index = "zensical.extensions.emoji.twemoji",
}
pymdownx.highlight = {
  anchor_linenums = true,
  line_spans = "__span",
  pygments_lang_class = true,
}
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences = {}
pymdownx.tabbed = { alternate_style = true, combine_header_slug = true }
pymdownx.tasklist = { custom_checkbox = true }
pymdownx.tilde = {}
