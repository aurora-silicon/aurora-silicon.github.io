# Zensical config for the Aurora Silicon documentation site.
# Copyright (c) 2026 Aurora Silicon

[project]
site_name = "Aurora Silicon"
site_url = "https://aurorasilicon.org/"
site_description = "Aurora Silicon"
repo_url = "https://github.com/aurora-silicon"
repo_name = "aurora-silicon"
copyright = "&copy; 2026 Aurora Silicon contributors"
docs_dir = "docs"
site_dir = "site"
extra_css = ["stylesheets/aurora.css"]
extra_javascript = ["javascripts/device-support.js"]

nav = [
  { "Home" = "index.md" },
  { "Feature Support" = [
    { "Overview" = "feature-support/overview.md" },
    { "M1 Series" = "feature-support/m1.md" },
    { "M2 Series" = "feature-support/m2.md" },
    { "M3 Series" = "feature-support/m3.md" },
    { "M4 Series" = "feature-support/m4.md" },
    { "M5 Series" = "feature-support/m5.md" },
    { "A18 Pro" = "feature-support/a18-pro.md" },
  ] },
  { "Project" = [
    { "Overview" = "project/overview.md" },
    { "FAQs" = "project/faqs.md" },
    { "Meet The Team" = "project/team.md" },
    { "Policies & Guidelines" = "project/policies-and-guidelines.md" },
    { "Attribution" = "project/attribution.md" },
  ] },
  { "Users" = [
    { "Getting Started" = "users/getting-started.md" },
    { "Installation" = "users/installation.md" },
    { "Removal" = "users/removal.md" },
  ] },
  { "Developers" = [
    { "Getting Started" = "developers/getting-started.md" },
    { "Development/Tooling" = "developers/development-tooling.md" },
    { "Testing" = "developers/testing.md" },
    { "Contributing" = "developers/contributing.md" },
  ] },
  { "Research" = [
    { "Overview" = "research/overview.md" },
    { "HAL Extension" = [
      { "AIC1" = "research/hal-extension/aic1.md" },
      { "AIC2" = "research/hal-extension/aic2.md" },
      { "AIC3" = "research/hal-extension/aic3.md" },
    ] },
    { "GPU" = [
      { "d3d12agx (mesa)" = "research/gpu/d3d12agx.md" },
    ] },
    { "Networking" = [
      { "Broadcom (M1-M4, A18 Pro)" = "research/networking/broadcom.md" },
      { "Apple (M5)" = "research/networking/apple.md" },
    ] },
    { "Security" = [
      { "Touch ID" = "research/security/touch-id.md" },
      { "Secure Boot" = "research/security/secure-boot.md" },
    ] },
  ] },
]

[project.theme]
variant = "modern"
custom_dir = "overrides"
language = "en"
logo = "assets/logo.png"
favicon = "assets/favicon.png"
font.text = "Inter"
font.code = "JetBrains Mono"
features = [
  "content.code.copy",
  "content.code.annotate",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/aurora-silicon"
name = "Aurora Silicon on GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/discord"
link = "https://discord.gg/DXmsSSc5aY"
name = "Aurora Silicon on Discord"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "orange"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "orange"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc = { permalink = true }
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji = {
  emoji_generator = "zensical.extensions.emoji.to_svg",
  emoji_index = "zensical.extensions.emoji.twemoji",
}
pymdownx.highlight = {
  anchor_linenums = true,
  line_spans = "__span",
  pygments_lang_class = true,
}
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences = {}
pymdownx.tabbed = { alternate_style = true, combine_header_slug = true }
pymdownx.tasklist = { custom_checkbox = true }
pymdownx.tilde = {}
